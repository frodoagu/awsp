name: release

# On every push to main, derive the next version from the Conventional Commits
# since the last tag (feat → minor, fix/perf → patch, breaking change → major),
# create the vX.Y.Z tag and publish a GitHub release whose notes are the
# changelog of those commits. Same setup as frodoagu/home.
#
# `default_bump: false`: commits that don't map to a bump (docs:, ci:, chore:,
# test:, refactor:…) produce no tag and no release.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # create tags and releases

# Two pushes close together must not compute the same next tag; queue them.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Tag & release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history and tags, to compute the version

      - name: Compute & create tag
        id: tag
        uses: mathieudutour/github-tag-action@af99e60ce8132224b8e6ebab5023449fe256ed46 # v7
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release_branches: main
          tag_prefix: v
          default_bump: false

      - name: Publish GitHub release
        if: steps.tag.outputs.new_tag != ''
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ steps.tag.outputs.new_tag }}
          name: ${{ steps.tag.outputs.new_tag }}
          body: ${{ steps.tag.outputs.changelog }}

      - name: Summary
        if: always()
        env:
          NEW_TAG: ${{ steps.tag.outputs.new_tag }}
          PREVIOUS_TAG: ${{ steps.tag.outputs.previous_tag }}
          RELEASE_TYPE: ${{ steps.tag.outputs.release_type }}
        run: |
          {
            echo "## Release"
            echo
            if [ -n "$NEW_TAG" ]; then
              echo "Released **$NEW_TAG** (\`$RELEASE_TYPE\` bump from \`$PREVIOUS_TAG\`):"
              echo "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$NEW_TAG"
            else
              echo "No \`feat\`, \`fix\` or breaking commits since the last tag: nothing to release."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
