name: test

on:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} (${{ matrix.bash }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bash: bash
          # The bash that ships with macOS (3.2), plus BSD script, sed, awk and column.
          - os: macos-latest
            bash: /bin/bash
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      # Best effort: when the runner's apt mirrors are down, the tests skip zsh on Linux
      # (macOS still runs them, since zsh ships with it).
      - name: Install zsh
        if: runner.os == 'Linux'
        continue-on-error: true
        timeout-minutes: 3
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh
      - name: Versions
        run: |
          ${{ matrix.bash }} -c 'echo "bash $BASH_VERSION"'
          zsh --version || echo "zsh: not installed"
      # Includes the zsh tests when zsh is installed.
      - name: Tests
        run: ${{ matrix.bash }} test/run.sh
