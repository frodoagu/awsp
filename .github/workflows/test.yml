name: test

on:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} (${{ matrix.bash }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bash: bash
          # The bash that ships with macOS (3.2), plus BSD script, sed, awk and column.
          - os: macos-latest
            bash: /bin/bash
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install zsh
        if: runner.os == 'Linux'
        # Retried: the runners' apt mirrors sometimes fail to resolve.
        run: |
          for attempt in 1 2 3; do
            sudo apt-get update -qq && sudo apt-get install -y -qq zsh && exit 0
            sleep 15
          done
          exit 1
      - name: Versions
        run: |
          ${{ matrix.bash }} -c 'echo "bash $BASH_VERSION"'
          zsh --version
      # Includes the zsh tests, since zsh is installed on both.
      - name: Tests
        run: ${{ matrix.bash }} test/run.sh
