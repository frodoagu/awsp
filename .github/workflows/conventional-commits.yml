name: conventional commits

# release-please builds the changelog and the next version from these messages.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  commits:
    name: commit messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # With no commitlint config in the repo, it uses @commitlint/config-conventional.
      - uses: wagoid/commitlint-github-action@v6

  # A squash merge uses the PR title as the commit message.
  title:
    name: PR title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
